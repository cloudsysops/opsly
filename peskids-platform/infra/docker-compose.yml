version: '3.8'

services:
  # Edge routing on client's domain
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/:/etc/nginx/certs/:ro
    networks:
      - peskids-net
    depends_on:
      - web

  # PostgreSQL database (Supabase-compatible)
  supabase-db:
    image: supabase/postgres:latest
    environment:
      POSTGRES_DB: peskids
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
      POSTGRES_INITDB_ARGS: -c max_connections=200
    volumes:
      - peskids-postgres-data:/var/lib/postgresql/data
    networks:
      - peskids-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for job queues and message broker
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?error} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - peskids-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js web app
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXT_PUBLIC_TENANT_ID: ${TENANT_ID:-peskids}
      NODE_ENV: production
    depends_on:
      supabase-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - peskids-net
    restart: unless-stopped

  # Orchestrator Agent - Central coordinator
  orchestrator-agent:
    build:
      context: ../apps/agents/orchestrator-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      AGENT_ROLE: orchestrator
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - peskids-net
    restart: unless-stopped

  # Social Media Agent
  social-media-agent:
    build:
      context: ../apps/agents/social-media-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      INSTAGRAM_TOKEN: ${INSTAGRAM_TOKEN:-}
      FACEBOOK_TOKEN: ${FACEBOOK_TOKEN:-}
      TIKTOK_TOKEN: ${TIKTOK_TOKEN:-}
      AGENT_ROLE: social_media
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # Docs Generator Agent
  docs-generator-agent:
    build:
      context: ../apps/agents/docs-generator-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      AGENT_ROLE: docs_generator
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # API Integration Agent
  api-integration-agent:
    build:
      context: ../apps/agents/api-integration-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      AGENT_ROLE: api_integration
      HUBSPOT_API_KEY: ${HUBSPOT_API_KEY:-}
      PIPEDRIVE_API_KEY: ${PIPEDRIVE_API_KEY:-}
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # Web Experience Agent
  web-experience-agent:
    build:
      context: ../apps/agents/web-experience-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      AGENT_ROLE: web_experience
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # Messaging Agent (APPROVAL-FIRST)
  messaging-agent:
    build:
      context: ../apps/agents/messaging-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AGENT_ROLE: messaging
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # Security Agent
  security-agent:
    build:
      context: ../apps/agents/security-agent
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SUPABASE_URL: ${SUPABASE_URL:?error}
      SUPABASE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?error}
      AGENT_ROLE: security
    depends_on:
      - orchestrator-agent
    networks:
      - peskids-net
    restart: unless-stopped

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${CLIENT_DOMAIN:?error}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?error}
      WEBHOOK_URL: https://${CLIENT_DOMAIN}/webhooks/n8n/
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: supabase-db
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:?error}
      DB_POSTGRESDB_DATABASE: n8n_db
      DB_POSTGRESDB_SSL: ${DB_SSL:-false}
    depends_on:
      supabase-db:
        condition: service_healthy
    networks:
      - peskids-net
    restart: unless-stopped
    volumes:
      - n8n-data:/home/node/.n8n

  # Uptime Monitoring (Uptime Kuma)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - peskids-net
    restart: unless-stopped

volumes:
  peskids-postgres-data:
  redis-data:
  n8n-data:
  uptime-kuma-data:

networks:
  peskids-net:
    driver: bridge
