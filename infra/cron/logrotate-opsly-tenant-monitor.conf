# Opsly VPS — tenant monitor + ops logs (runtime/logs only)
# Install: sudo cp infra/cron/logrotate-opsly-tenant-monitor.conf /etc/logrotate.d/opsly-tenant-monitor
/opt/opsly/runtime/logs/tenant-monitor.log
/opt/opsly/runtime/logs/tenant-monitor.cron.log
/opt/opsly/runtime/logs/disk-alert.cron.log
/opt/opsly/runtime/logs/feedback.log
/opt/opsly/runtime/logs/backup.log
/opt/opsly/runtime/logs/cleanup.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0644 vps-dragon vps-dragon
    maxsize 20M
}
