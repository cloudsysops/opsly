version: "3.9"

services:
  grafana:
    image: grafana/grafana:latest
    container_name: opsly_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hermes2026
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - opsly-mcp
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: opsly_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_storage:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - opsly-mcp
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: opsly_loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yml
      - loki_storage:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - opsly-mcp
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: opsly_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - opsly-mcp
    restart: unless-stopped
    depends_on:
      - loki

volumes:
  grafana_storage:
  alertmanager_storage:
  loki_storage:

networks:
  opsly-mcp:
    external: true
