server {
    listen 80;
    server_name _;

    location /api/health {
        default_type application/json;
        return 200 '{"status":"ok","service":"wacrm-health-proxy","tenant":"peskids"}';
    }

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 302 https://peskids.op-sly.com/admin;
    }
}
