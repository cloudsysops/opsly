# Content Studio AI Service
# Deploy: docker-compose -f infra/docker-compose.content-studio.yml up -d
# Or extend existing stack: docker-compose -f infra/docker-compose.mcp.yml -f infra/docker-compose.content-studio.yml up -d

version: "3.9"

services:
  content-studio:
    build:
      context: ..
      dockerfile: apps/content-studio-service/Dockerfile
    container_name: opsly_content_studio
    ports:
      - "3013:3013"
    environment:
      - NODE_ENV=production
      - PORT=3013
      # LLM Provider: 'anthropic' (direct SDK) | 'gateway' (internal llm-gateway)
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      # Required when LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Required when LLM_PROVIDER=gateway
      - LLM_GATEWAY_URL=${LLM_GATEWAY_URL:-http://llm-gateway:3010}
      # Optional API key for authentication (leave empty for open access in dev)
      - CONTENT_STUDIO_API_KEY=${CONTENT_STUDIO_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3013/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - opsly-content

networks:
  opsly-content:
    name: opsly-content
    driver: bridge
    # Use external: true and name: opsly-mcp if joining the existing Opsly network
    # external: true
