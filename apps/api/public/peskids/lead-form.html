<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peskids — solicitar información</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, select, button { width: 100%; margin-top: 0.25rem; padding: 0.5rem; box-sizing: border-box; }
      button { margin-top: 1.5rem; background: #0ea5e9; color: #fff; border: none; cursor: pointer; }
      .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; }
      .ok { background: #dcfce7; }
      .err { background: #fee2e2; }
    </style>
  </head>
  <body>
    <h1>Peskids</h1>
    <p>Programa extracurricular — déjanos tus datos y te contactamos.</p>
    <form id="lead-form">
      <label>Nombre completo <input name="name" required minlength="2" maxlength="50" /></label>
      <label>Email <input name="email" type="email" required /></label>
      <label>Teléfono (opcional) <input name="phone" type="tel" /></label>
      <label>Modalidad de clase
        <select name="class_modality" required>
          <option value="">Selecciona…</option>
          <option value="llanogrande">Sede Llanogrande (Rionegro)</option>
          <option value="domicilio">Clase a domicilio</option>
        </select>
      </label>
      <label>Barrio o zona <input name="neighborhood" required minlength="2" maxlength="80" placeholder="Ej. Llanogrande, Envigado…" /></label>
      <label>Grado de interés
        <select name="grade_interested" required>
          <option value="">Selecciona…</option>
          <option>K-5</option>
          <option>6-8</option>
          <option>9-12</option>
          <option>Other</option>
        </select>
      </label>
      <label>¿Cómo nos conociste?
        <select name="referral_source">
          <option value="">Opcional</option>
          <option>Google</option>
          <option>Friend</option>
          <option>Facebook</option>
          <option>Instagram</option>
          <option>Other</option>
          <option>Not sure</option>
        </select>
      </label>
      <button type="submit">Enviar</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <script>
      const apiBase = window.location.origin;
      const form = document.getElementById('lead-form');
      const status = document.getElementById('status');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        status.className = 'msg';
        status.textContent = 'Enviando…';
        const fd = new FormData(form);
        const body = Object.fromEntries(fd.entries());
        if (!body.referral_source) delete body.referral_source;
        if (!body.phone) delete body.phone;
        try {
          const res = await fetch(apiBase + '/api/public/tenants/peskids/leads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Error');
          status.className = 'msg ok';
          status.textContent = '¡Gracias! Te contactaremos pronto.';
          form.reset();
        } catch (err) {
          status.className = 'msg err';
          status.textContent = err.message || 'Algo salió mal. Intenta de nuevo.';
        }
      });
    </script>
  </body>
</html>
