# Agent Services Configuration
# Used by LocalOpenCodeWorker and other local agent workers
services:
  local_opencode:
    enabled: true
    endpoint: http://localhost:5004
    env_var: OPSLY_OPENCODE_AGENT_URL
    timeout: 60000
    retry_attempts: 2
    fallback_provider: claude

  local_claude:
    enabled: true
    endpoint: http://localhost:5002
    env_var: OPSLY_CLAUDE_AGENT_URL
    timeout: 60000
    retry_attempts: 2

  local_copilot:
    enabled: true
    endpoint: http://localhost:5003
    env_var: OPSLY_COPILOT_AGENT_URL
    timeout: 60000
    retry_attempts: 2

  local_cursor:
    enabled: true
    endpoint: http://localhost:5001
    env_var: OPSLY_CURSOR_AGENT_URL
    timeout: 30000
    retry_attempts: 2

  local_codex:
    enabled: true
    endpoint: http://localhost:5005
    env_var: OPSLY_CODEX_AGENT_URL
    timeout: 120000
    retry_attempts: 1

  local_openai:
    enabled: true
    endpoint: http://localhost:5006
    env_var: OPSLY_OPENAI_AGENT_URL
    timeout: 120000
    retry_attempts: 1

  local_hermes:
    enabled: true
    endpoint: http://localhost:5007
    env_var: OPSLY_HERMES_AGENT_URL
    timeout: 120000
    retry_attempts: 1

  local_decepticon:
    enabled: true
    endpoint: http://localhost:5008
    env_var: OPSLY_DECEPTICON_AGENT_URL
    timeout: 120000
    retry_attempts: 1

  local_aider:
    enabled: true
    endpoint: http://localhost:5009
    env_var: OPSLY_AIDER_AGENT_URL
    timeout: 300000
    retry_attempts: 1

  local_goose:
    enabled: true
    endpoint: http://localhost:5010
    env_var: OPSLY_GOOSE_AGENT_URL
    timeout: 300000
    retry_attempts: 1

  local_playwright:
    enabled: true
    endpoint: http://localhost:5011
    env_var: OPSLY_PLAYWRIGHT_AGENT_URL
    timeout: 300000
    retry_attempts: 1
