id: franchise-os
status: experimental
summary: Reusable Franchise OS via @intcloudsysops/franchise-core. Peskids is the first adapter; never one Opsly tenant per sede.
capabilities:
  - franchise_units
  - territories
  - agreements
  - versioned_royalties
  - audits
tables:
  - platform.franchise_networks
  - platform.franchisees
  - platform.franchise_units
  - platform.franchise_territories
  - platform.franchise_agreements
  - platform.royalty_rules
  - platform.royalty_calculations
policies:
  - tenant_slug_remains_peskids
  - no_tenant_per_sede
  - royalty_calculations_immutable
  - franchisee_distinct_from_unit
docs:
  - docs/tenants/peskids/FRANCHISES.md
extract_when: second tenant activates franchise-core entitlement
