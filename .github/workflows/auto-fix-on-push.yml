# Opsly — workflow catalog: docs/ops/workflows-index.md
name: Auto-fix on push

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/admin/**'
      - 'scripts/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-fix-main
  cancel-in-progress: true

jobs:
  review-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: ESLint --fix (api + admin)
        run: |
          set +e
          npm run lint:fix -w @intcloudsysops/api || true
          npm run lint:fix -w @intcloudsysops/admin || true
          exit 0

      - name: Prettier --write
        run: |
          set +e
          if [ -f node_modules/prettier/package.json ]; then
            npx prettier --write \
              "apps/api/**/*.{ts,tsx,js,jsx,json,md}" \
              "apps/admin/**/*.{ts,tsx,js,jsx,json,md}" \
              --ignore-unknown || true
          fi
          exit 0

      - name: Open bounded PR if changes (never commit directly to main)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HUSKY: 0
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes after auto-fix"
            exit 0
          fi

          # Do not create an unbounded PR-per-main-SHA stream. If any auto-fix PR
          # is already open, let that owner finish/rebase it before creating more WIP.
          OPEN_AUTO_FIX="$(gh pr list --repo "${{ github.repository }}" \
            --state open --search 'head:auto-fix/push-' --json number --jq 'length')"
          if [ "${OPEN_AUTO_FIX}" -ge 1 ]; then
            echo "⏭️ ${OPEN_AUTO_FIX} auto-fix PR already open; refusing duplicate WIP."
            exit 0
          fi

          DATE="$(date -u +%Y-%m-%d)"
          SHA_SHORT="$(git rev-parse --short HEAD)"
          BRANCH="auto-fix/push-${SHA_SHORT}"

          git stash push -u -m "auto-fix-${SHA_SHORT}"
          git fetch origin
          git checkout -b "${BRANCH}"
          git stash pop

          git add -A
          git commit -m "chore: auto-fix code quality on ${SHA_SHORT}"
          git push origin "HEAD:${BRANCH}"

          PR_BODY="$(printf '%s\n\n%s\n\n%s' \
            "Automated ESLint/Prettier fixes triggered by push to main." \
            "Triggered by commit \`${SHA_SHORT}\`. Review before merging. Only one auto-fix PR may remain open at a time." \
            "Workflow: ${RUN_URL}")"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${BRANCH}" \
            --title "chore: auto-fix code quality (${DATE} ${SHA_SHORT})" \
            --body "${PR_BODY}"

          echo "✅ Bounded auto-fix PR created for branch ${BRANCH}"
