name: Test VPS -> WSL Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  # This machine's Tailscale IP
  WSL_TAILSCALE_IP: "100.115.197.109"

jobs:
  test-vps-to-wsl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Connect Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}

      - name: Test VPS -> WSL connectivity
        uses: appleboy/ssh-action@v1.0.3
        env:
          WSL_TAILSCALE_IP: ${{ env.WSL_TAILSCALE_IP }}
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 5m
          envs: WSL_TAILSCALE_IP
          script: |
            set -euo pipefail
            echo "=== Testing VPS -> WSL connectivity ==="
            echo "Target WSL IP: ${WSL_TAILSCALE_IP}"
            
            # Test 1: Tailscale ping from VPS to WSL
            echo "--- Test 1: Tailscale ping ---"
            if tailscale ping ${WSL_TAILSCALE_IP} 2>&1; then
              echo "✅ Tailscale ping SUCCESS"
            else
              echo "❌ Tailscale ping FAILED"
            fi
            
            # Test 2: Regular ping
            echo "--- Test 2: ICMP ping ---"
            if ping -c 3 -W 2 ${WSL_TAILSCALE_IP} 2>&1; then
              echo "✅ ICMP ping SUCCESS"
            else
              echo "❌ ICMP ping FAILED"
            fi
            
            # Test 3: Check Tailscale status on VPS
            echo "--- Test 3: VPS Tailscale status ---"
            tailscale status --json | jq -r '.Peer[] | "\(.HostName): \(.TailscaleIPs[0]) Online=\(.Online)"' 2>/dev/null || tailscale status
            
            # Test 4: Check if WSL is in peer list
            echo "--- Test 4: WSL in peer list ---"
            if tailscale status --json | jq -e '.Peer[] | select(.TailscaleIPs[0] == "${WSL_TAILSCALE_IP}")' >/dev/null 2>&1; then
              echo "✅ WSL found in Tailscale peer list"
            else
              echo "❌ WSL NOT found in Tailscale peer list"
            fi
            
            # Test 5: SSH port scan (port 22)
            echo "--- Test 5: SSH port scan ---"
            if timeout 5 bash -c "cat < /dev/null > /dev/tcp/${WSL_TAILSCALE_IP}/22" 2>&1; then
              echo "✅ SSH port 22 OPEN"
            else
              echo "❌ SSH port 22 CLOSED/FILTERED"
            fi
            
            echo "=== VPS -> WSL connectivity test complete ==="

      - name: Test WSL -> VPS (reverse)
        if: env.TAILSCALE_AUTHKEY != ''
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}

      - name: Test Runner -> VPS connectivity
        run: |
          echo "=== Testing Runner -> VPS from GitHub runner ==="
          echo "Runner Tailscale IP: $(tailscale status --json 2>/dev/null | jq -r '.Self.TailscaleIPs[0]' || echo 'N/A')"
          echo "VPS Tailscale IP: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}"
          
          # Ping VPS from runner
          if tailscale ping ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }} 2>&1; then
            echo "✅ Runner -> VPS Tailscale ping SUCCESS"
          else
            echo "❌ Runner -> VPS Tailscale ping FAILED"
          fi