# Build and deploy an exact main commit to the isolated Peskids staging container.
# This workflow never uses the production container.
name: Peskids staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact main SHA to stage'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: peskids-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      image: ghcr.io/cloudsysops/peskids:sha-${{ steps.ref.outputs.sha }}
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Resolve exact release SHA
        id: ref
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$EVENT_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected full commit SHA" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate staging-only public configuration
        env:
          STAGING_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          [ -n "$STAGING_NEXT_PUBLIC_SUPABASE_URL" ] || { echo "Missing STAGING_NEXT_PUBLIC_SUPABASE_URL in staging environment" >&2; exit 1; }
          [ -n "$STAGING_SUPABASE_ANON_KEY" ] || { echo "Missing STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY in staging environment" >&2; exit 1; }
          if [ -x scripts/ci/assert-peskids-staging-isolation.sh ]; then
            bash scripts/ci/assert-peskids-staging-isolation.sh
          else
            ref="$(printf '%s' "$STAGING_NEXT_PUBLIC_SUPABASE_URL" | sed -n 's#https://\([a-z0-9]*\)\.supabase\..*#\1#p')"
            echo "PESKIDS_STAGING_ISOLATION: staging_ref=${ref}"
            echo "PESKIDS_STAGING_ISOLATION: production_ref=jkwykpldnitavhmtuzmo"
            [ -n "$ref" ] && [ "$ref" != "jkwykpldnitavhmtuzmo" ] && [ "$ref" = "hljetbbgiphpjbldebpo" ] \
              || { echo "PESKIDS_STAGING_ISOLATION: refuse deploy — staging is not opsly-QA" >&2; exit 1; }
          fi

      - name: Build immutable Peskids image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/peskids/Dockerfile
          push: true
          tags: ghcr.io/cloudsysops/peskids:sha-${{ steps.ref.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_PESKIDS_SITE_URL=https://peskids-staging.${{ secrets.STAGING_PLATFORM_DOMAIN }}
            NEXT_PUBLIC_PESKIDS_CONTACT_EMAIL=${{ secrets.STAGING_NEXT_PUBLIC_PESKIDS_CONTACT_EMAIL }}
            NEXT_PUBLIC_PESKIDS_WHATSAPP_E164=${{ secrets.STAGING_NEXT_PUBLIC_PESKIDS_WHATSAPP_E164 }}
            NEXT_PUBLIC_PESKIDS_WHATSAPP_DISPLAY=${{ secrets.STAGING_NEXT_PUBLIC_PESKIDS_WHATSAPP_DISPLAY }}
            NEXT_PUBLIC_PESKIDS_WHATSAPP_PREFILL=${{ secrets.STAGING_NEXT_PUBLIC_PESKIDS_WHATSAPP_PREFILL }}
            PESKIDS_GIT_SHA=${{ steps.ref.outputs.sha }}
            PESKIDS_IMAGE_TAG=ghcr.io/cloudsysops/peskids:sha-${{ steps.ref.outputs.sha }}

  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1

      - name: Connect Tailscale for SSH
        if: env.TAILSCALE_AUTHKEY != ''
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}

      - name: Deploy isolated staging container and verify SHA
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          PESKIDS_IMAGE: ${{ needs.build.outputs.image }}
          PESKIDS_IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          DOPPLER_TOKEN_STG: ${{ secrets.DOPPLER_TOKEN_STG }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 5m
          command_timeout: 25m
          envs: RELEASE_SHA,PESKIDS_IMAGE,PESKIDS_IMAGE_DIGEST,DOPPLER_TOKEN_STG,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/opsly-staging
            git fetch origin "$RELEASE_SHA"
            git -c advice.detachedHead=false checkout "$RELEASE_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u github-actions --password-stdin
            export RELEASE_SHA PESKIDS_IMAGE PESKIDS_IMAGE_DIGEST DOPPLER_TOKEN_STG
            bash scripts/peskids-staging-deploy.sh

      - name: Write immutable release candidate evidence
        env:
          SHA: ${{ needs.build.outputs.sha }}
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          STAGING_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" --arg image "$IMAGE" --arg digest "$DIGEST" --arg run "$STAGING_RUN" \
            '{commitSha:$sha,imageTag:$image,imageDigest:$digest,stagingDeployment:"peskids-staging",stagingHealth:"ok",stagingVerification:"passed",stagingRunId:$run,securityResults:"CI security checks passed",migrationPlan:"No production migration applied by this workflow",createdAt:(now|todateiso8601)}' \
            > release-candidate.json
          cat release-candidate.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: peskids-release-candidate
          path: release-candidate.json
          retention-days: 30
