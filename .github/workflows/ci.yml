# Opsly — workflow catalog: docs/ops/workflows-index.md
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-validation:
    name: Structure Integrity
    uses: ./.github/workflows/structure-validation.yml

  workflow-lint:
    name: Workflow Lint
    needs: structure-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  lint:
    needs:
      - structure-validation
      - workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci + build workspace deps for type-check
        run: |
          set -euo pipefail
          npm ci
          (cd apps/ml && npm run build)
          (cd lib/git-branch-orchestrator && npm run build)
          (cd lib/session-manager && npm run build)
          (cd lib/runtime && npm run build)

      - name: TypeScript (api + admin + portal + mcp + orchestrator + ml + llm-gateway + context-builder)
        run: |
          set -euo pipefail
          (cd apps/api && npx tsc --noEmit) & pid1=$!
          (cd apps/admin && npx tsc --noEmit) & pid2=$!
          (cd apps/portal && npx tsc --noEmit) & pid3=$!
          (cd apps/mcp && npx tsc --noEmit) & pid4=$!
          (cd apps/orchestrator && npx tsc --noEmit) & pid5=$!
          (cd apps/ml && npx tsc --noEmit) & pid6=$!
          (cd apps/llm-gateway && npx tsc --noEmit) & pid7=$!
          (cd apps/context-builder && npx tsc --noEmit) & pid8=$!
          status=0
          wait $pid1 || status=1
          wait $pid2 || status=1
          wait $pid3 || status=1
          wait $pid4 || status=1
          wait $pid5 || status=1
          wait $pid6 || status=1
          wait $pid7 || status=1
          wait $pid8 || status=1
          exit $status

      - name: OpenAPI subset (CI gate; duplica validate-context para fallo temprano en PR)
        run: npm run validate-openapi

      - name: ESLint si existe config (paralelo)
        run: |
          set -euo pipefail
          run_eslint() {
            dir="$1"
            if compgen -G "${dir}/eslint.config.*" >/dev/null 2>&1 \
              || [ -f "${dir}/.eslintrc.json" ] \
              || [ -f "${dir}/.eslintrc.cjs" ] \
              || [ -f "${dir}/.eslintrc.js" ]; then
              (cd "$dir" && npx eslint .)
            else
              echo "No ESLint config in ${dir}, skipping"
            fi
          }
          run_eslint apps/api & pid1=$!
          run_eslint apps/admin & pid2=$!
          run_eslint apps/portal & pid3=$!
          run_eslint apps/mcp & pid4=$!
          run_eslint apps/orchestrator & pid5=$!
          run_eslint apps/ml & pid6=$!
          run_eslint apps/llm-gateway & pid7=$!
          run_eslint apps/context-builder & pid8=$!
          status=0
          wait $pid1 || status=1
          wait $pid2 || status=1
          wait $pid3 || status=1
          wait $pid4 || status=1
          wait $pid5 || status=1
          wait $pid6 || status=1
          wait $pid7 || status=1
          wait $pid8 || status=1
          exit $status

  test-unit:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci + unit tests (api/portal/mcp/ml/llm-gateway)
        run: |
          set -euo pipefail
          npm ci
          # Build internal packages first (required for tests that import them)
          (cd apps/notebooklm-agent && npm run build) 2>/dev/null || true
          (cd apps/ml && npm run build)
          (cd apps/llm-gateway && npm run build)
          (cd apps/mcp && npm run build)
          (cd apps/context-builder && npm run build)
          # Unit-oriented suites (without Redis service dependency)
          (cd apps/api && npm test) & pid_api=$!
          (cd apps/portal && npm test) & pid0=$!
          (cd apps/mcp && npm test) & pid1=$!
          (cd apps/ml && npm test) & pid3=$!
          (cd apps/llm-gateway && npm test -- --exclude __tests__/cache-namespace.test.ts) & pid4=$!
          status=0
          wait $pid_api || status=1
          wait $pid0 || status=1
          wait $pid1 || status=1
          wait $pid3 || status=1
          wait $pid4 || status=1
          exit $status

  test-integration:
    needs: lint
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci + integration tests (orchestrator + llm-gateway cache namespace with Redis)
        run: |
          set -euo pipefail
          export REDIS_URL="${REDIS_URL:-redis://127.0.0.1:6379}"
          npm ci
          # Build ALL internal packages first (required for tests that import them)
          (cd lib/git-branch-orchestrator && npm run build)
          (cd lib/session-manager && npm run build)
          (cd lib/runtime && npm run build)
          (cd apps/ml && npm run build)
          (cd apps/llm-gateway && npm run build)
          (cd apps/orchestrator && npm run build)
          (cd apps/context-builder && npm run build)
          (cd apps/notebooklm-agent && npm run build) 2>/dev/null || true
          # Integration suites requiring Redis
          (cd apps/orchestrator && npm test)
          (cd apps/llm-gateway && npm test -- --run __tests__/cache-namespace.test.ts)

      - name: Run ValidationOrchestrator E2E Tests with Coverage
        run: |
          set -euo pipefail
          cd apps/orchestrator
          npm run test:coverage -- src/__tests__/validation-orchestrator-e2e.test.ts

      - name: Check Coverage Threshold
        run: |
          set -euo pipefail
          cd apps/orchestrator
          # Run test with coverage and capture output
          npm run test:coverage -- src/__tests__/validation-orchestrator-e2e.test.ts 2>&1 | tee coverage.log
          # Extract coverage percentage (looks for "Statements" line)
          coverage=$(grep -oP 'Statements\s+:\s+\K[\d.]+' coverage.log | head -1)
          if [ -z "$coverage" ]; then
            echo "Warning: Could not extract coverage percentage from test output"
            echo "This may indicate tests are still running or format changed. Proceeding with caution."
            exit 0
          fi
          threshold=85
          if (( $(echo "$coverage < $threshold" | bc -l) )); then
            echo "ERROR: Coverage ${coverage}% is below threshold of ${threshold}%"
            exit 1
          else
            echo "SUCCESS: Coverage ${coverage}% meets threshold of ${threshold}%"
          fi

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci + build all packages (ml, llm-gateway, api, admin, portal)
        run: |
          set -euo pipefail
          npm ci
          # Build internal packages first (lib/* before orchestrator)
          (cd apps/ml && npm run build)
          (cd lib/git-branch-orchestrator && npm run build)
          (cd lib/session-manager && npm run build)
          (cd lib/runtime && npm run build)
          (cd apps/llm-gateway && npm run build)
          (cd apps/orchestrator && npm run build)
          (cd apps/mcp && npm run build)
          (cd apps/context-builder && npm run build)
          (cd apps/notebooklm-agent && npm run build) 2>/dev/null || true
          # Then build apps in parallel
          (cd apps/api && npm run build) & pid1=$!
          (cd apps/admin && npm run build) & pid2=$!
          (cd apps/portal && npm run build) & pid3=$!
          status=0
          wait $pid1 || status=1
          wait $pid2 || status=1
          wait $pid3 || status=1
          exit $status

  scripts-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (scripts/*.sh)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Instalar shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: shellcheck scripts/*.sh
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Solo fallar en issues severity=error (el repo histórico tiene muchos style/info)
          shellcheck -S error scripts/*.sh

  secret-scan:
    needs: structure-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  e2e-invite:
    needs:
      - lint
      - test-unit
      - test-integration
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: |
          npm ci
      - name: Validate E2E required secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.PLATFORM_ADMIN_TOKEN }}"
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
      - name: Run E2E invite script
        run: |
          export ADMIN_TOKEN="${{ secrets.PLATFORM_ADMIN_TOKEN }}"
          export OWNER_EMAIL="jkbotero78@gmail.com"
          export TENANT_SLUG="localrank"
          bash scripts/test-e2e-invite-flow.sh

      - name: Run Playwright E2E tests (portal with Supabase)
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          export PORTAL_URL="https://portal.ops.smiletripcare.com"
          npm run test:e2e --workspace=@intcloudsysops/portal


  trivy-scan:
      name: Trivy Security Scan
          needs: structure-validation
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v4

                                    - name: Run Trivy vulnerability scanner
                                            uses: aquasecurity/trivy-action@master
                                                    with:
                                                              scan-type: 'fs'
                                                                        scan-ref: '.'
                                                                                  format: 'sarif'
                                                                                            output: 'trivy-results.sarif'

                                                                                                        - name: Upload Trivy results to GitHub Security tab
                                                                                                                uses: github/codeql-action/upload-sarif@v2
                                                                                                                        if: always()
                                                                                                                                with:
                                                                                                                                          sarif_file: 'trivy-results.sarif'
