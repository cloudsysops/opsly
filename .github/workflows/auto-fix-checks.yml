name: Auto-Fix Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Check missing modules
        id: missing-modules
        run: |
          npm install --legacy-peer-deps 2>&1 | tee install.log || true
          if grep -q "MODULE_NOT_FOUND\|ERR!" install.log; then
            echo "has-missing=true" >> $GITHUB_OUTPUT
          else
            echo "has-missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Fix lint errors
        id: lint-fix
        run: |
          npm run lint:fix 2>&1 | tee lint.log || true
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and test
        id: build-test
        run: |
          npm run build 2>&1 || true
          npm run test:unit 2>&1 || true
          npm run test:integration 2>&1 || true

      - name: Auto-commit fixes
        if: steps.lint-fix.outputs.changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'chore(governance): auto-fix linting and dependencies'
          file_pattern: 'package*.json src/**/*.ts src/**/*.js .'
          commit_options: '--no-verify'

      - name: Check if all checks pass
        id: checks
        run: |
          npm run test:all 2>&1
          echo "checks-passed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const hasIssues = '${{ steps.missing-modules.outputs.has-missing }}' === 'true';
            const lintFixed = '${{ steps.lint-fix.outputs.changes }}' === 'true';
            const checksPass = '${{ steps.checks.outputs.checks-passed }}' === 'true';

            let comment = '## 🤖 Governance Check Results\n\n';
            comment += `- **Missing Modules**: ${hasIssues ? '❌ Found' : '✅ None'}\n`;
            comment += `- **Lint Fixes Applied**: ${lintFixed ? '✅ Yes' : '❌ No fixes needed'}\n`;
            comment += `- **All Checks Passing**: ${checksPass ? '✅ Yes' : '❌ Some failures'}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
