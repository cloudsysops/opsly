# Opsly — workflow catalog: docs/ops/workflows-index.md
# Validates Doppler access and presence of variables listed in config/doppler-ci-required*.txt.
# Security invariant: secret-bearing PR validation executes only trusted base-revision code.
name: Validate Doppler Config

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-doppler:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Install Doppler CLI
        run: |
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 https://cli.doppler.com/install.sh | sudo sh

      - name: Validate Doppler prd
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN_PRD is not configured."
            exit 1
          fi
          chmod +x scripts/ci/validate-doppler-vars.sh
          ./scripts/ci/validate-doppler-vars.sh ops-intcloudsysops prd

      - name: Validate Doppler stg
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG }}
        run: |
          set -euo pipefail
          if [ -z "${DOPPLER_TOKEN:-}" ]; then
            echo "::error::DOPPLER_TOKEN_STG is not configured."
            exit 1
          fi
          chmod +x scripts/ci/validate-doppler-vars.sh
          ./scripts/ci/validate-doppler-vars.sh ops-intcloudsysops stg
