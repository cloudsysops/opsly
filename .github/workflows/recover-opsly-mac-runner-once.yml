name: Recover Opsly Mac Runner Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-opsly-mac-runner-once.yml'
  pull_request:
    paths:
      - '.github/workflows/recover-opsly-mac-runner-once.yml'
  workflow_dispatch:

concurrency:
  group: recover-opsly-mac-runner-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/actions/tailscale-connect/action.yml
          test -f scripts/setup-vps-ssh-to-opsly-admin.sh
          echo "recovery_path=github-hosted->tailscale->vps->opsly-admin"
          echo "runner_policy=existing-only"
          echo "production_mutation=forbidden"
          echo "OPSLY_MAC_RECOVERY_CONTRACT_OK"

  recover:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'fix/recover-opsly-mac-runner-out-of-band' &&
        github.actor == 'cboteros'
      )
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      VPS_TARGET_HOST: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST || '100.120.151.91' }}
      VPS_USER: ${{ secrets.VPS_USER || 'vps-dragon' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Assert trusted same-repo recovery context
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"
          test "${{ github.event.pull_request.head.ref }}" = "fix/recover-opsly-mac-runner-out-of-band"
          test "${{ github.actor }}" = "cboteros"
          echo "trusted_same_repo_recovery=true"

      - name: Require Tailscale auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAILSCALE_AUTHKEY:-}" || { echo "TAILSCALE_AUTHKEY=missing"; exit 1; }

      - name: Require VPS target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_TARGET_HOST:-}"
          test -n "${VPS_USER:-}"

      - name: Require VPS SSH key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_SSH_KEY:-}" || { echo "VPS_SSH_KEY=missing"; exit 1; }

      - name: Connect GitHub-hosted runner to Opsly tailnet
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ env.VPS_TARGET_HOST }}

      - name: Probe GitHub to VPS SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 2m
          script: |
            set -euo pipefail
            echo "VPS_SSH_OK"
            hostname

      - name: Probe VPS to Opsly Mac SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 2m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=10 opsly-admin-from-vps 'echo OPSLY_ADMIN_SSH_OK && hostname'

      - name: Locate Mac opsly-control checkout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 3m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            repo=""
            for candidate in "$HOME/opsly-control" "$HOME/src/opsly-control" "$HOME/Projects/opsly-control" "$HOME/Documents/opsly-control"; do
              if [[ -d "$candidate/.git" ]]; then repo="$candidate"; break; fi
            done
            if [[ -z "$repo" ]]; then
              repo="$(find "$HOME" -maxdepth 4 -type d -name opsly-control -exec test -d '{}/.git' ';' -print -quit 2>/dev/null || true)"
            fi
            [[ -n "$repo" && -d "$repo/.git" ]] || { echo "BLOCKER_OPSLY_CONTROL_CHECKOUT_NOT_FOUND"; exit 78; }
            printf '%s\n' "$repo" > "$HOME/.opsly-control-recovery-path"
            echo "MAC_CONTROL_CHECKOUT_FOUND"
            REMOTE_MAC

      - name: Verify Mac control checkout origin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 3m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            repo="$(cat "$HOME/.opsly-control-recovery-path")"
            origin="$(git -C "$repo" remote get-url origin 2>/dev/null || true)"
            case "$origin" in
              *cloudsysops/opsly-control*) echo "MAC_CONTROL_ORIGIN_OK" ;;
              *) echo "BLOCKER_UNEXPECTED_CONTROL_REPO_ORIGIN"; exit 78 ;;
            esac
            REMOTE_MAC

      - name: Verify Mac control checkout clean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 3m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            repo="$(cat "$HOME/.opsly-control-recovery-path")"
            if [[ -n "$(git -C "$repo" status --porcelain)" ]]; then
              echo "BLOCKER_OPSLY_CONTROL_DIRTY_WORKTREE"
              git -C "$repo" status --short | head -30
              exit 78
            fi
            echo "MAC_CONTROL_WORKTREE_CLEAN"
            REMOTE_MAC

      - name: Probe Mac operator auth
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 3m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            command -v gh >/dev/null || { echo "BLOCKER_LOCAL_GH_MISSING"; exit 78; }
            command -v doppler >/dev/null || { echo "BLOCKER_LOCAL_DOPPLER_MISSING"; exit 78; }
            gh auth status >/dev/null 2>&1 || { echo "BLOCKER_LOCAL_GH_AUTH"; exit 78; }
            doppler me >/dev/null 2>&1 || { echo "BLOCKER_LOCAL_DOPPLER_AUTH"; exit 78; }
            echo "MAC_OPERATOR_AUTH_OK"
            REMOTE_MAC

      - name: Sync Mac control checkout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 3m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            repo="$(cat "$HOME/.opsly-control-recovery-path")"
            git -C "$repo" fetch origin main
            git -C "$repo" checkout main
            git -C "$repo" pull --ff-only origin main
            echo "MAC_CONTROL_SYNC_OK"
            REMOTE_MAC

      - name: Repair existing Mac runner service and Actions auth
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_TARGET_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          timeout: 2m
          command_timeout: 8m
          script: |
            set -euo pipefail
            ssh -o BatchMode=yes -o ConnectTimeout=12 opsly-admin-from-vps 'bash -s' <<'REMOTE_MAC'
            set -euo pipefail
            repo="$(cat "$HOME/.opsly-control-recovery-path")"
            cd "$repo"
            bash scripts/configure-agent-queue-gh.sh --no-dispatch
            bash scripts/configure-agent-queue-gh.sh --check-only
            rm -f "$HOME/.opsly-control-recovery-path"
            echo "OPSLY_MAC_RUNNER_RECOVERY_OK"
            REMOTE_MAC
