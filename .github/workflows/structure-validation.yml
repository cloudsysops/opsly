# Opsly — workflow catalog: docs/ops/workflows-index.md
name: Structure Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_call:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate structure (strict CI mode)
        run: npm run validate:strict:ci

      - name: Enforce staging-first release boundary
        run: node scripts/ci/check-release-boundary.mjs

      - name: Validate immutable rollback-plan contracts
        run: node --test scripts/deploy/__tests__/release-rollback-plan.test.mjs

      - name: Report results
        if: failure()
        run: |
          echo "::error::Structure validation failed. Check the logs for details."
          echo "Run 'npm run validate:strict' locally to inspect issues."
