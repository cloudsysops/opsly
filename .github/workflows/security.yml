# Opsly — workflow catalog: docs/ops/workflows-index.md
# CVE & secret scanning — runs on every PR and weekly cron.
# PR policy: block only MODERATE+ advisories introduced by the PR vs its base SHA.
# Baseline policy: scheduled/manual runs keep the full MODERATE+ audit gate.
# Docker Scout CVE scan runs on images already pushed to GHCR (post-deploy).
# TruffleHog secret scan runs in ci.yml (see: secret-scan job).

name: Security scan

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches new CVEs without a code change
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # for SARIF upload (optional future use)
  pull-requests: write

jobs:
  npm-audit:
    name: npm audit (moderate+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm audit — fail on new moderate+ advisories
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=moderate --omit=dev --json > audit-head.json 2>&1
          HEAD_EXIT=$?
          set -e

          # Scheduled/manual runs remain the strict full-baseline gate.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            cp audit-head.json audit-report.json
            exit "$HEAD_EXIT"
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          BASE_AUDIT="$RUNNER_TEMP/audit-base.json"
          BASE_TREE="$RUNNER_TEMP/audit-base-tree"
          trap 'git worktree remove --force "$BASE_TREE" >/dev/null 2>&1 || true' EXIT

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$BASE_TREE" "$BASE_SHA"

          (
            cd "$BASE_TREE"
            set +e
            npm audit --package-lock-only --audit-level=moderate --omit=dev --json > "$BASE_AUDIT" 2>&1
            exit 0
          )

          BASE_SHA="$BASE_SHA" BASE_AUDIT="$BASE_AUDIT" node <<'NODE'
          const fs = require('fs');

          const rank = { info: 0, low: 1, moderate: 2, high: 3, critical: 4 };

          function load(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (error) {
              console.error(`Unable to parse npm audit JSON at ${path}: ${error.message}`);
              process.exit(2);
            }
          }

          function advisorySet(report) {
            const out = new Set();
            for (const [pkg, vuln] of Object.entries(report.vulnerabilities || {})) {
              if ((rank[vuln.severity] ?? -1) < rank.moderate) continue;
              for (const via of vuln.via || []) {
                if (!via || typeof via !== 'object') continue;
                const id = via.source ?? via.url ?? via.title;
                if (id) out.add(`${pkg}::${id}`);
              }
            }
            return out;
          }

          const head = load('audit-head.json');
          const base = load(process.env.BASE_AUDIT);
          const headSet = advisorySet(head);
          const baseSet = advisorySet(base);
          const introduced = [...headSet].filter(item => !baseSet.has(item)).sort();
          const inherited = [...headSet].filter(item => baseSet.has(item)).sort();

          const report = {
            policy: 'pr-advisory-delta',
            base_sha: process.env.BASE_SHA,
            head_sha: process.env.GITHUB_SHA,
            inherited_count: inherited.length,
            introduced_count: introduced.length,
            introduced,
          };

          fs.writeFileSync('audit-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (introduced.length) process.exit(1);
          NODE

          # Keep full audit visibility without making inherited findings block unrelated PRs.
          npm audit --audit-level=moderate 2>&1 || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            audit-report.json
            audit-head.json
          if-no-files-found: ignore

      - name: Comment PR with audit summary (on failure)
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY="## ⚠️ npm audit found MODERATE+ vulnerabilities

          Run \`npm audit --audit-level=moderate\` locally to see details.
          This PR cannot be merged until vulnerabilities are resolved or explicitly exempted.

          [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY" 2>/dev/null || true

  docker-scout:
    name: Docker Scout CVE scan
    runs-on: ubuntu-latest
    # Only run on schedule or manual dispatch (images may not exist on PR branches)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker Scout — API image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/cloudsysops/intcloudsysops-api:latest
          only-severities: high,critical
          exit-code: true
        continue-on-error: true

      - name: Docker Scout — Portal image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/cloudsysops/intcloudsysops-portal:latest
          only-severities: high,critical
          exit-code: true
        continue-on-error: true

      - name: Docker Scout — LLM Gateway image
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ghcr.io/cloudsysops/intcloudsysops-llm-gateway:latest
          only-severities: high,critical
          exit-code: true
        continue-on-error: true

      - name: Notify Discord on CVE findings
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{embeds:[{title:"🔴 CVEs HIGH/CRITICAL found in Docker images",color:15158332,fields:[{name:"Run",value:$url}]}]}')"
