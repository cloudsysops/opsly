# Governed night integration queue.
# IMPORTANT: merge != release. This workflow never dispatches Deploy and never
# applies migrations/n8n/production changes. Release workflows own activation.
name: Night merge

on:
  schedule:
    # America/Bogota = UTC-5 year-round: 23:00, 01:00, 03:00 local.
    - cron: "0 4,6,8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip night-window clock gate (emergency/test only)"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "List eligible PRs without merging"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: read

concurrency:
  group: governed-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce night window
        if: inputs.force != true
        run: node scripts/ci/check-production-change-window.mjs --check-now

      - name: Admission contract tests
        run: node --test scripts/ci/__tests__/governed-merge-candidates.test.mjs

      - name: Merge bounded night batch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PRS < <(node scripts/ci/governed-merge-candidates.mjs --route night --limit 3)
          if [ "${#PRS[@]}" -eq 0 ]; then
            echo "No exact-head night candidates"
            exit 0
          fi

          for pr in "${PRS[@]}"; do
            sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            echo "night candidate #$pr @$sha"
            if [ "$DRY_RUN" = "1" ]; then
              continue
            fi
            # Merge only. GITHUB_TOKEN prevents push-triggered Deploy recursion.
            gh pr merge "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --delete-branch \
              --admin \
              --match-head-commit "$sha"
          done
