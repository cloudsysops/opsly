# Opsly — workflow catalog: docs/ops/workflows-index.md
name: Cleanup Expired Demos
on:
  schedule: [{ cron: '0 * * * *' }]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup demos
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_ADMIN_TOKEN:-}" ] || [ -z "${NEXT_PUBLIC_APP_URL:-}" ]; then
            echo "Skipping cleanup workflow: missing API URL or PLATFORM_ADMIN_TOKEN secret."
            exit 0
          fi
          bash scripts/cleanup-demos.sh
        env:
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_APP_URL }}
