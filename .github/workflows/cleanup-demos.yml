# Opsly — workflow catalog: docs/ops/workflows-index.md
name: Cleanup Expired Demos
on:
  schedule: [{ cron: '0 * * * *' }]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup demos
        if: ${{ secrets.PLATFORM_ADMIN_TOKEN != '' && (secrets.NEXT_PUBLIC_API_URL != '' || secrets.NEXT_PUBLIC_APP_URL != '') }}
        run: bash scripts/cleanup-demos.sh
        env:
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_APP_URL }}

      - name: Skip cleanup when required secrets are missing
        if: ${{ !(secrets.PLATFORM_ADMIN_TOKEN != '' && (secrets.NEXT_PUBLIC_API_URL != '' || secrets.NEXT_PUBLIC_APP_URL != '')) }}
        run: echo "Skipping cleanup workflow: missing API URL or PLATFORM_ADMIN_TOKEN secret."
