# Peskids production promotion only.
# Build and staging happen in peskids-staging.yml. This workflow never rebuilds.
name: Promote Peskids release candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact commit SHA of a successful Peskids staging candidate'
        required: true
        type: string

concurrency:
  group: promote-peskids-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  resolve-candidate:
    name: Resolve and verify release candidate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.candidate.outputs.image }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Find successful staging run for exact SHA
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full 40-character SHA" >&2; exit 1; }
          run_id="$(gh run list --workflow peskids-staging.yml --commit "$RELEASE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] || { echo "No successful Peskids staging run for $RELEASE_SHA" >&2; exit 1; }
          mkdir -p candidate
          gh run download "$run_id" --name peskids-release-candidate --dir candidate
          test -s candidate/release-candidate.json
          jq -e --arg sha "$RELEASE_SHA" '.commitSha == $sha and .stagingHealth == "ok" and .stagingVerification == "passed"' candidate/release-candidate.json >/dev/null
          image="$(jq -r '.imageTag' candidate/release-candidate.json)"
          digest="$(jq -r '.imageDigest' candidate/release-candidate.json)"
          [[ "$image" == ghcr.io/cloudsysops/peskids:sha-* ]] || { echo "Candidate image is not immutable" >&2; exit 1; }
          [[ "$digest" == sha256:* ]] || { echo "Candidate has no image digest" >&2; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
          cat candidate/release-candidate.json >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote exact artifact to production
    needs: resolve-candidate
    runs-on: ubuntu-latest
    environment: production
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce Bogotá production window
        run: node scripts/ci/check-production-change-window.mjs --mode deploy

      - name: Validate production deploy secrets
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          DOPPLER_TOKEN_PRD: ${{ secrets.DOPPLER_TOKEN_PRD }}
        run: |
          set -euo pipefail
          [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_HOST" ] && [ -n "$DOPPLER_TOKEN_PRD" ]

      - name: Connect Tailscale for SSH
        if: env.TAILSCALE_AUTHKEY != ''
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}

      - name: Promote candidate image without rebuilding
        id: promote
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          PESKIDS_IMAGE: ${{ needs.resolve-candidate.outputs.image }}
          PESKIDS_IMAGE_DIGEST: ${{ needs.resolve-candidate.outputs.image_digest }}
          DOPPLER_TOKEN_PRD: ${{ secrets.DOPPLER_TOKEN_PRD }}
          PESKIDS_DEPLOY_IN_PLACE: '1'
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 5m
          command_timeout: 25m
          envs: RELEASE_SHA,PESKIDS_IMAGE,PESKIDS_IMAGE_DIGEST,DOPPLER_TOKEN_PRD,PESKIDS_DEPLOY_IN_PLACE
          script: |
            set -euo pipefail
            cd /opt/opsly
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            export PESKIDS_IMAGE
            export PESKIDS_DEPLOY_IN_PLACE=1
            bash scripts/peskids-promote-vps.sh --promote
            body="$(curl -fsSL --max-time 20 http://127.0.0.1:3004/api/health)"
            echo "$body" | jq -e --arg sha "$RELEASE_SHA" --arg tag "$PESKIDS_IMAGE" '.status == "ok" and .git_sha == $sha and .image_tag == $tag' >/dev/null
            echo "Promoted $RELEASE_SHA ($PESKIDS_IMAGE, $PESKIDS_IMAGE_DIGEST)"

      - name: Verify public production SHA and smoke
        env:
          EXPECTED_SHA: ${{ inputs.release_sha }}
          EXPECTED_IMAGE: ${{ needs.resolve-candidate.outputs.image }}
        run: |
          set -euo pipefail
          health="$(curl -fsSL --max-time 20 https://www.peskids.com/api/health)"
          echo "$health" | jq -e --arg sha "$EXPECTED_SHA" --arg tag "$EXPECTED_IMAGE" '.status == "ok" and .git_sha == $sha and .image_tag == $tag' >/dev/null
          curl -fsSL --max-time 20 https://www.peskids.com/ >/dev/null
          curl -fsSL --max-time 20 https://www.peskids.com/admin/login >/dev/null
          echo "Production SHA verified: $EXPECTED_SHA"

      - name: Roll back failed promotion to previous immutable image
        if: failure() && steps.promote.outcome != 'skipped'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOPPLER_TOKEN_PRD: ${{ secrets.DOPPLER_TOKEN_PRD }}
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 5m
          command_timeout: 25m
          envs: DOPPLER_TOKEN_PRD
          script: |
            set -euo pipefail
            cd /opt/opsly
            bash scripts/peskids-promote-vps.sh --rollback
