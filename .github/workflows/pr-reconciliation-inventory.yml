name: PR Reconciliation Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

concurrency:
  group: pr-reconciliation-inventory
  cancel-in-progress: true

jobs:
  inventory:
    name: Classify open pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build reconciliation inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RECONCILIATION_OUTPUT: pr-reconciliation-inventory.json
        run: node scripts/ops/pr-reconciliation-inventory.mjs

      - name: Publish inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-reconciliation-inventory
          path: pr-reconciliation-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Write run summary
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const inventory = JSON.parse(fs.readFileSync('pr-reconciliation-inventory.json', 'utf8'));
          console.log('# PR Reconciliation Inventory');
          console.log('');
          console.log(`Generated: ${inventory.generatedAt}`);
          console.log('');
          console.log('| Lane | Count |');
          console.log('| --- | ---: |');
          for (const [lane, count] of Object.entries(inventory.summary)) {
            console.log(`| ${lane} | ${count} |`);
          }
          console.log('');
          console.log('## Safety invariants');
          console.log('- Read-only inventory only');
          console.log('- No auto-merge');
          console.log('- No production deploy');
          console.log('- Peskids/production/runtime-sensitive surfaces are classified PROTECTED');
          NODE
