name: Gamer OpenCode physical acceptance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: gamer-opencode-physical-acceptance
  cancel-in-progress: false

jobs:
  physical-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Windows host (SSH/desktop). HTTP worker plane is WSL — do not curl smdqcia-pc for :3011/:5004/:11434.
      GAMER_WINDOWS_HOST: smdqcia-pc
      # Canonical worker MagicDNS (verified: resolves + serves orch/OpenCode/Ollama on the tailnet).
      GAMER_WORKER_HOST: smdqcia-wsl
      GAMER_WORKER_ID: home-gpu-01
      # Documented current Tailscale IPv4 for smdqcia-wsl (prefer MagicDNS; IP is fallback only).
      GAMER_WORKER_IP_FALLBACK: '100.115.197.109'
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Detect Gamer WSL worker availability
        id: gamer
        shell: bash
        run: |
          set -euo pipefail
          host="${GAMER_WORKER_HOST}"
          if ! getent hosts "$host" >/tmp/gamer-dns.txt 2>&1; then
            echo "::warning::MagicDNS miss for $host; trying documented IP fallback"
            host="${GAMER_WORKER_IP_FALLBACK}"
            echo "$host" > /tmp/gamer-dns.txt
          fi
          echo "resolved_host=$host" >> "$GITHUB_OUTPUT"
          echo "GAMER_RESOLVED_HOST=$host"
          cat /tmp/gamer-dns.txt || true

          if tailscale ping -c 1 --timeout=8s "$host" >/tmp/gamer-ping.txt 2>&1; then
            echo "online=true" >> "$GITHUB_OUTPUT"
            echo "PC_GAMER_ONLINE worker_id=$GAMER_WORKER_ID host=$host windows_host=$GAMER_WINDOWS_HOST"
          else
            cat /tmp/gamer-ping.txt || true
            echo "online=false" >> "$GITHUB_OUTPUT"
            echo "PC_GAMER_OFFLINE worker_id=$GAMER_WORKER_ID host=$host"
          fi

      - name: Fail when Gamer WSL worker is unavailable
        if: steps.gamer.outputs.online != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence
          {
            echo 'PC_GAMER_OFFLINE'
            echo "worker_host=${GAMER_WORKER_HOST}"
            echo "resolved_host=${{ steps.gamer.outputs.resolved_host }}"
            echo "windows_host=${GAMER_WINDOWS_HOST}"
            echo 'legacy_pc_gamer=100.74.88.103 (retired; not probed)'
          } | tee "runtime/evidence/gamer-opencode-physical-acceptance-${GITHUB_RUN_ID}.log"
          echo "::error::Gamer WSL worker unavailable — failing acceptance (not a deferred success)"
          exit 1

      - name: Verify Gamer WSL runtime surfaces
        if: steps.gamer.outputs.online == 'true'
        shell: bash
        run: |
          set -euo pipefail
          host="${{ steps.gamer.outputs.resolved_host }}"
          curl -fsS --max-time 8 "http://${host}:3011/health" | tee /tmp/gamer-health.json
          curl -fsS --max-time 8 "http://${host}:5004/health" | tee /tmp/opencode-health.json
          curl -fsS --max-time 8 "http://${host}:11434/api/tags" | tee /tmp/ollama-tags.json
          jq -e '.status == "ok"' /tmp/gamer-health.json >/dev/null
          jq -e '.status == "ok" and .agent == "opencode"' /tmp/opencode-health.json >/dev/null
          if ! jq -e '
            [.models[]?.name]
            | map(select(test("qwen3-coder|qwen2\\.5-coder"; "i")))
            | length > 0
          ' /tmp/ollama-tags.json >/dev/null; then
            echo "::error::Ollama missing required Qwen coding model (qwen3-coder* or qwen2.5-coder*). Installed:"
            jq -r '.models[]?.name // empty' /tmp/ollama-tags.json || true
            echo "Do not install models from CI. Operator must pull on the Gamer WSL worker."
            exit 1
          fi
          echo "GAMER_RUNTIME_SURFACES_OK host=$host"

      - name: Setup Node
        if: steps.gamer.outputs.online == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify governed dispatch credentials
        if: steps.gamer.outputs.online == 'true'
        env:
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PLATFORM_ADMIN_TOKEN:-}" || {
            echo "::error::PLATFORM_ADMIN_TOKEN is not configured"
            exit 1
          }

      - name: Run exact Gamer OpenCode acceptance
        if: steps.gamer.outputs.online == 'true'
        env:
          OPSLY_ORCHESTRATOR_URL: http://100.120.151.91:3011
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          OPSLY_GITHUB_AGENT_REQUIRE_COMPLETION: 'true'
          OPSLY_GITHUB_AGENT_EXPECT_MARKER: GAMER_OPENCODE_OK
          OPSLY_GITHUB_AGENT_POLL_SECONDS: '420'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/evidence
          node scripts/ops/github-agent-queue-submit.mjs \
            docs/01-development/night-queue/050-gamer-opencode-physical-acceptance.md \
            | tee "runtime/evidence/gamer-opencode-physical-acceptance-${GITHUB_RUN_ID}.log"
          if ! grep -q 'GAMER_OPENCODE_OK\|GITHUB_AGENT_QUEUE_MARKER_OK=GAMER_OPENCODE_OK' \
            "runtime/evidence/gamer-opencode-physical-acceptance-${GITHUB_RUN_ID}.log"; then
            echo "::error::Acceptance log missing GAMER_OPENCODE_OK marker"
            exit 1
          fi

      - name: Publish acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamer-opencode-physical-acceptance-${{ github.run_id }}
          path: runtime/evidence/gamer-opencode-physical-acceptance-*.log
          if-no-files-found: warn
          retention-days: 14
