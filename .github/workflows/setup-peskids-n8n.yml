# Manual: import Peskids n8n workflows on VPS (container n8n_peskids).
# Requires production environment secrets: VPS_USER, VPS_SSH_KEY, VPS_SSH_HOST or VPS_HOST;
# TAILSCALE_AUTHKEY recommended for SSH via tailnet.

name: Setup Peskids N8N

on:
  workflow_dispatch:
    inputs:
      vps_host:
        description: VPS host override (Tailscale IP or hostname)
        required: false
        default: "100.120.151.91"
      dry_run:
        description: Dry run (list workflows only, no import)
        required: false
        default: "false"

concurrency:
  group: setup-peskids-n8n
  cancel-in-progress: false

jobs:
  setup-n8n:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${VPS_USER:-}" ] || { echo "Missing VPS_USER" >&2; missing=1; }
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "Missing VPS_SSH_KEY" >&2; missing=1; }
          if [ -z "${VPS_SSH_HOST:-}" ] && [ -z "${VPS_HOST:-}" ] && [ -z "${{ inputs.vps_host }}" ]; then
            echo "Missing VPS_SSH_HOST, VPS_HOST, or vps_host input" >&2
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Connect Tailscale for SSH
        if: env.TAILSCALE_AUTHKEY != ''
        uses: ./.github/actions/tailscale-connect
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}
          ping_host: ${{ inputs.vps_host || secrets.VPS_SSH_HOST || secrets.VPS_HOST || '100.120.151.91' }}

      - name: Import Peskids n8n workflows on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ inputs.vps_host || secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 10m
          envs: DRY_RUN
          script: |
            set -euo pipefail
            cd /opt/opsly
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            args=()
            if [ "${DRY_RUN:-false}" = "true" ]; then
              args+=(--dry-run)
            fi
            ./scripts/install-peskids-n8n-workflows.sh "${args[@]}"

      - name: Health check (n8n public)
        if: inputs.dry_run != 'true'
        run: |
          set +e
          for i in 1 2 3; do
            if curl -sfk "https://n8n-peskids.op-sly.com/healthz" | head -c 200 | grep -qE 'ok|n8n'; then
              echo "n8n-peskids.op-sly.com OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/3..."
            sleep 10
          done
          echo "::warning::Could not verify n8n healthz (container may still be starting)"
          exit 0

      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then exit 0; fi
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Setup Peskids N8N failed\",\"color\":15158332,\"fields\":[{\"name\":\"Run\",\"value\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}]}"
