name: ValidationOrchestrator Health Check

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:
    inputs:
      skip_discord:
        description: 'Skip Discord alerts (for testing)'
        required: false
        default: 'false'

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Watchdog Health Check
        id: watchdog
        run: npx tsx scripts/watchdog-validation-orchestrator.ts
        env:
          ORCHESTRATOR_ENDPOINT: ${{ secrets.ORCHESTRATOR_ENDPOINT || 'http://localhost:3011' }}
          DISCORD_WEBHOOK_HEALTH: ${{ secrets.DISCORD_WEBHOOK_HEALTH }}
        continue-on-error: true

      - name: Report Status
        if: always()
        run: |
          if [ ${{ steps.watchdog.outcome }} = "success" ]; then
            echo "✓ Health check passed"
            exit 0
          else
            echo "✗ Health check failed or returned non-zero exit code"
            exit 1
          fi

      - name: Create Issue on Critical Failure
        if: failure() && steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 ValidationOrchestrator Health Check Failed',
              body: `
              A scheduled health check for ValidationOrchestrator failed.

              - **Workflow**: ${context.workflow}
              - **Run ID**: ${context.runId}
              - **Branch**: ${context.ref}
              - **Timestamp**: ${new Date().toISOString()}

              Check the [workflow run](${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.
              `,
              labels: ['health-check', 'critical']
            })

  # Store health metrics in artifact for dashboard integration
  archive-metrics:
    runs-on: ubuntu-latest
    needs: health-check
    if: always()

    steps:
      - name: Archive health check results
        uses: actions/upload-artifact@v3
        with:
          name: health-check-results-${{ github.run_id }}
          path: health-check-*.json
          retention-days: 30
