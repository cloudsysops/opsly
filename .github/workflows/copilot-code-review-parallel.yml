name: "Copilot Code Review - 24/7 Parallel"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  copilot-review:
    name: AI Code Review Agent
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Request Copilot Code Review
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Copilot review workflow is configured for security, performance, code_quality, and mcp_compliance checks.')
