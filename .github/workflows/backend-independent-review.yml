# Opsly Open Review Agent — genera la review mediante el orchestrator gobernado
# y local_opencode -> Ollama/Qwen en compute local; no usa Copilot/Codex ni fallback cloud.
#
# SEGURIDAD: mismo patrón que trusted-independent-review.yml — el paso que corre
# scripts/ci/backend-independent-review.mjs hace checkout de la BASE SHA
# confiable, nunca ejecuta código del PR head. Solo lee el PR (diff, checks,
# reviews existentes) vía API de GitHub.
#
# ubuntu-latest se une a Tailscale efímeramente para alcanzar el orchestrator
# interno. El script encola una tarea read-only local_opencode y espera evidencia
# terminal de un modelo ollama/qwen*. Si no hay worker/Qwen local, falla cerrado;
# no existe fallback a OpenAI/Anthropic/otros proveedores cloud.

name: Open-source independent review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: open-source-independent-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  open-source-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current main tip
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/${{ github.repository }}/git/refs/heads/main --jq '.object.sha')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base (reviewer script only — never PR-head code)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Join tailnet (ephemeral, this job only)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Opsly Open Review Agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPSLY_ORCHESTRATOR_URL: http://100.120.151.91:3011
          PLATFORM_ADMIN_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}
          OPSLY_GITHUB_REPO: ${{ github.repository }}
          OPSLY_REVIEW_POLL_SECONDS: '420'
        run: |
          node scripts/ci/backend-independent-review.mjs --pr "${{ github.event.pull_request.number }}"
