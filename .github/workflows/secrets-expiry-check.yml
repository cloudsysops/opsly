# Weekly + manual check: secrets approaching expiry / review due.
# Inventory: config/secrets-lifecycle.json (dates only — no secret values).
# Docs: docs/runbooks/SECRETS-KEY-MANAGEMENT.md

name: Secrets expiry check

on:
  schedule:
    # Mondays 14:00 UTC ≈ 09:00 America/Bogota
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail job if any secret is already expired'
        required: false
        type: boolean
        default: true

concurrency:
  group: secrets-expiry-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check secrets lifecycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/ops/check-secrets-expiry.sh
          # Schedule always strict (expired keys fail CI). Manual can disable.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.strict }}" != "true" ]; then
            ./scripts/ops/check-secrets-expiry.sh
          else
            ./scripts/ops/check-secrets-expiry.sh --strict
          fi
