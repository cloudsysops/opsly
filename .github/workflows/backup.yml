# Opsly — workflow catalog: docs/ops/workflows-index.md
# Backup diario en el VPS (tenants). Requiere SSH al staging/prod según secrets.
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, DISCORD_WEBHOOK_URL (opcional)
# Integridad: el script sube a S3 (*.sql.gz + .sha256) y verifica SHA256 en runtime.

name: Backup tenants

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS SSH secrets
        id: precheck
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          if [ -n "${VPS_USER:-}" ] && [ -n "${VPS_SSH_KEY:-}" ] && { [ -n "${VPS_SSH_HOST:-}" ] || [ -n "${VPS_HOST:-}" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar backup en VPS
        id: backup
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/opsly
            ./scripts/backup-tenants.sh

      - name: Verificar integridad de backups
        id: integrity
        if: ${{ steps.backup.outcome == 'success' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/opsly
            set -a
            # shellcheck disable=SC1091
            [ -f .env ] && source .env
            set +a
            MIN_BYTES=1024
            DATE_UTC="$(date -u +%Y-%m-%d)"
            S3_PREFIX="${S3_PREFIX:-opsly/backups}"
            if [ -z "${S3_BUCKET:-}" ] || [ -z "${AWS_REGION:-}" ]; then
              echo "❌ Missing S3_BUCKET or AWS_REGION in /opt/opsly/.env"
              exit 1
            fi
            PREFIX="s3://${S3_BUCKET}/${S3_PREFIX}/${DATE_UTC}/"
            echo "Checking S3 prefix ${PREFIX}"
            mapfile -t OBJECTS < <(aws s3 ls "${PREFIX}" --region "${AWS_REGION}" | awk '/\.sql\.gz$/ && !/\.sha256$/ {print $4}')
            if [ ${#OBJECTS[@]} -eq 0 ]; then
              echo "❌ No *.sql.gz backups under ${PREFIX}"
              exit 1
            fi
            FAILED=0
            for key in "${OBJECTS[@]}"; do
              uri="${PREFIX}${key}"
              size="$(aws s3 ls "${uri}" --region "${AWS_REGION}" | awk '{print $3}')"
              if [ -z "${size}" ] || [ "${size}" -lt "${MIN_BYTES}" ]; then
                echo "❌ Backup too small or missing: ${uri} (${size:-0} bytes)"
                FAILED=1
                continue
              fi
              if aws s3 ls "${uri}.sha256" --region "${AWS_REGION}" >/dev/null 2>&1; then
                echo "✅ ${key} (${size} bytes) + checksum sidecar"
              else
                echo "⚠️  ${key} (${size} bytes) without .sha256 sidecar"
              fi
            done
            if [ "${FAILED}" -ne 0 ]; then
              exit 1
            fi
            echo "✅ ${#OBJECTS[@]} tenant backup(s) present in S3 for ${DATE_UTC}"

      - name: Skip backup when SSH secrets are missing
        if: ${{ steps.precheck.outputs.ready != 'true' }}
        run: 'echo "Skipping backup workflow: missing VPS SSH secrets."'

      - name: Notificar Discord (éxito)
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL no configurado; omitiendo notificación"
            exit 0
          fi
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "✅ Backup tenants OK (integridad verificada)" \
              --arg ts "$TS" \
              '{embeds:[{title:$title,color:3066993,timestamp:$ts}]}')"

      - name: Notificar Discord (fallo)
        if: failure()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL no configurado; omitiendo notificación"
            exit 0
          fi
          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{embeds:[{title:"❌ Backup tenants fallido o integridad inválida",color:15158332,fields:[{name:"Run",value:$url}]}]}')"
