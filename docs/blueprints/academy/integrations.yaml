apiVersion: opsly.io/v1alpha1
kind: IntegrationCatalog
metadata:
  blueprint: academy
spec:
  integrations:
    - id: supabase
      purpose: system-of-record
      required: true
      defaultEnabled: true
      adapter: existing
    - id: twenty
      purpose: crm
      required: true
      defaultEnabled: true
      adapter: lib/services/twenty
    - id: n8n
      purpose: workflow-automation
      required: true
      defaultEnabled: true
      adapter: existing
    - id: wacrm
      purpose: whatsapp-inbox-optional
      required: false
      defaultEnabled: false
      adapter: lib/wacrm-channel
      activationGate: manual-channel-registration
    - id: meta_whatsapp
      purpose: whatsapp-cloud-api-primary
      required: false
      defaultEnabled: false
      adapter: lib/whatsapp-channel
      activationGate: sandbox-then-human-go-no-go
      webhook: /api/webhooks/meta/whatsapp
      health: /api/health/whatsapp
    - id: wompi
      purpose: payments
      required: false
      defaultEnabled: false
      adapter: lib/wompi-gateway
  forbiddenDefaults:
    - legacy-crm-enabled
    - outbound-without-approval
    - secrets-in-contracts
    - enable-whatsapp-without-ready-state
