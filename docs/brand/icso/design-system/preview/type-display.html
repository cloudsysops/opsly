<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Type — display (Orbitron)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0E27;color:#fff;font-family:var(--font-sans);}
  body{padding:20px;}
  .word{font-family:var(--font-display);font-weight:700;font-size:48px;letter-spacing:.16em;background:linear-gradient(90deg,#00FFFF,#FF00FF);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .row{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-display);}
  .l{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #223064;padding-bottom:6px;}
  .l span:last-child{font-family:var(--font-mono);font-size:11px;color:#94A3B8;margin-left:auto;}
  .a{font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#00FFFF;}
  .b{font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:#fff;}
  .c{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#fff;}
</style>
</head>
<body>
<div class="word">OPSLY</div>
<div class="row">
  <div class="l"><span class="a">MISSION CONTROL</span><span>Orbitron 700 · 24/.12em</span></div>
  <div class="l"><span class="b">OPSLY · ADMIN</span><span>Orbitron 700 · 18/.16em</span></div>
  <div class="l"><span class="c">PLATFORM OVERVIEW</span><span>Orbitron 600 · 14/.12em</span></div>
</div>
</body></html>
