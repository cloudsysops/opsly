<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Colors — web (violet/indigo)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0A0A;color:#fff;font-family:var(--font-sans-system);}
  body{padding:20px;}
  .row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .sw{border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#111;}
  .chip{height:78px;}
  .meta{display:flex;justify-content:space-between;padding:10px 12px;}
  .name{font-family:var(--font-mono);font-size:12px;}
  .hex{font-family:var(--font-mono);font-size:12px;color:#94A3B8;}
  .grad{margin-top:14px;height:64px;border-radius:12px;background:linear-gradient(90deg,#7C3AED,#6366F1);display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:-.01em;font-size:22px;}
  .gtext{background:linear-gradient(90deg,#A78BFA,#818CF8);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#7C3AED"></div><div class="meta"><span class="name">violet · primary</span><span class="hex">#7C3AED</span></div></div>
  <div class="sw"><div class="chip" style="background:#6366F1"></div><div class="meta"><span class="name">indigo</span><span class="hex">#6366F1</span></div></div>
</div>
<div class="grad">Automatización <span class="gtext" style="margin-left:.4em">IA</span></div>
</body></html>
