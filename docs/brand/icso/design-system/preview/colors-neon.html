<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Colors — neon (admin)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0E27;color:#fff;font-family:var(--font-sans);}
  body{padding:18px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .sw{border-radius:8px;overflow:hidden;border:1px solid #223064;background:#101734;}
  .chip{height:78px;}
  .meta{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid #223064;}
  .name{font-family:var(--font-mono);font-size:11px;color:#fff;}
  .hex{font-family:var(--font-mono);font-size:11px;color:#94A3B8;}
  .glow{display:flex;gap:14px;margin-top:14px;align-items:center;}
  .gtag{font-family:var(--font-display);font-size:14px;letter-spacing:.16em;padding:6px 14px;border:1px solid;border-radius:4px;}
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#00FFFF;box-shadow:inset 0 0 30px rgba(0,255,255,.6)"></div><div class="meta"><span class="name">cyan · primary</span><span class="hex">#00FFFF</span></div></div>
  <div class="sw"><div class="chip" style="background:#FF00FF;box-shadow:inset 0 0 30px rgba(255,0,255,.5)"></div><div class="meta"><span class="name">magenta</span><span class="hex">#FF00FF</span></div></div>
  <div class="sw"><div class="chip" style="background:#9D00FF;box-shadow:inset 0 0 30px rgba(157,0,255,.5)"></div><div class="meta"><span class="name">purple</span><span class="hex">#9D00FF</span></div></div>
</div>
<div class="glow">
  <span class="gtag" style="color:#00FFFF;border-color:#00FFFF;text-shadow:0 0 8px rgba(0,255,255,.5)">CYAN</span>
  <span class="gtag" style="color:#FF00FF;border-color:#FF00FF;text-shadow:0 0 8px rgba(255,0,255,.5)">MAGENTA</span>
  <span class="gtag" style="color:#9D00FF;border-color:#9D00FF;text-shadow:0 0 8px rgba(157,0,255,.5)">PURPLE</span>
</div>
</body></html>
