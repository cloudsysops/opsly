<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0A0A;color:#fff;font-family:var(--font-sans);}
  body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  h4{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#94A3B8;margin:0 0 10px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  /* admin/portal style */
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:2px;border:1px solid;height:32px;padding:0 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font-sans);transition:all .15s ease-out;}
  .b-default{background:#111;border-color:#1E1E1E;color:#F5F5F5;}
  .b-primary{background:rgba(34,197,94,.15);border-color:#22C55E;color:#22C55E;}
  .b-destructive{background:rgba(239,68,68,.1);border-color:#EF4444;color:#EF4444;}
  .b-ghost{background:transparent;border-color:transparent;color:#D4D4D4;}
  .b-link{background:transparent;border:0;color:#22C55E;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;padding:0;height:auto;}
  /* web style */
  .wbtn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:12px 24px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-sans-system);transition:all .15s;}
  .w-primary{background:#7C3AED;color:#fff;border:0;}
  .w-primary:hover{background:#8B5CF6;}
  .w-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.8);}
</style>
</head>
<body>
<div>
  <h4>Admin / portal · sharp 2px</h4>
  <div class="row">
    <button class="btn b-default">default</button>
    <button class="btn b-primary">▶ primary</button>
    <button class="btn b-destructive">destructive</button>
    <button class="btn b-ghost">ghost</button>
    <a class="btn b-link">link →</a>
  </div>
  <div class="row" style="margin-top:10px;">
    <button class="btn b-default" style="height:28px;font-size:12px;">sm</button>
    <button class="btn b-default">default</button>
    <button class="btn b-default" style="height:36px;padding:0 16px;">lg</button>
  </div>
</div>
<div>
  <h4>Web · rounded 8px violet</h4>
  <div class="row">
    <button class="wbtn w-primary">Empezar ahora →</button>
    <button class="wbtn w-ghost">Ver demo</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <button class="wbtn w-primary" style="opacity:.5;cursor:not-allowed">Redirigiendo…</button>
  </div>
</div>
</body></html>
