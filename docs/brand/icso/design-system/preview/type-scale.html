<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Type — scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0A0A;color:#fff;font-family:var(--font-sans);}
  body{padding:18px;}
  .row{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:baseline;border-bottom:1px solid #1E1E1E;padding:8px 0;}
  .row:last-child{border:0;}
  .meta{font-family:var(--font-mono);font-size:11px;color:#94A3B8;text-align:right;}
  .h1{font-family:var(--font-sans-system);font-weight:800;font-size:48px;letter-spacing:-.01em;line-height:1.05;}
  .h2{font-family:var(--font-sans-system);font-weight:700;font-size:32px;line-height:1.2;}
  .lead{font-family:var(--font-sans);font-size:18px;color:#A3A3A3;}
  .body{font-family:var(--font-sans);font-size:14px;}
  .cap{font-family:var(--font-mono);font-size:12px;color:#94A3B8;text-transform:uppercase;letter-spacing:.18em;}
  .grad{background:linear-gradient(90deg,#A78BFA,#818CF8);-webkit-background-clip:text;background-clip:text;color:transparent;}
</style>
</head>
<body>
  <div class="row"><span class="h1">Automatización <span class="grad">IA</span></span><span class="meta">H1 · 48/800</span></div>
  <div class="row"><span class="h2">Precios simples y transparentes</span><span class="meta">H2 · 32/700</span></div>
  <div class="row"><span class="lead">Sin DevOps, sin configuraciones complicadas.</span><span class="meta">Lead · 18/400</span></div>
  <div class="row"><span class="body">Cancela en cualquier momento. Soporte por email en 48h.</span><span class="meta">Body · 14/400</span></div>
  <div class="row"><span class="cap">PLATAFORMA · VPS, LOCAL Y LLM</span><span class="meta">Eyebrow · 12 mono / .18em</span></div>
</body></html>
