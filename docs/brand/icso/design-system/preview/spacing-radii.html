<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Spacing & radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0A0A;color:#fff;font-family:var(--font-sans);}
  body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  h4{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#94A3B8;margin:0 0 10px;}
  .stack{display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:11px;color:#A3A3A3;}
  .b{display:flex;align-items:center;gap:10px;}
  .bar{height:8px;background:#22C55E;border-radius:1px;}
  .rad{display:flex;gap:10px;align-items:flex-end;}
  .r{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:#A3A3A3;}
  .box{width:60px;height:60px;background:#111;border:1px solid #1E1E1E;}
</style>
</head>
<body>
<div>
  <h4>Spacing scale (4px base)</h4>
  <div class="stack">
    <div class="b"><div class="bar" style="width:4px"></div><span>4 · space-1</span></div>
    <div class="b"><div class="bar" style="width:8px"></div><span>8 · space-2</span></div>
    <div class="b"><div class="bar" style="width:12px"></div><span>12 · space-3</span></div>
    <div class="b"><div class="bar" style="width:16px"></div><span>16 · space-4</span></div>
    <div class="b"><div class="bar" style="width:24px"></div><span>24 · space-6</span></div>
    <div class="b"><div class="bar" style="width:32px"></div><span>32 · space-8</span></div>
    <div class="b"><div class="bar" style="width:48px"></div><span>48 · space-12</span></div>
  </div>
</div>
<div>
  <h4>Radii</h4>
  <div class="rad">
    <div class="r"><div class="box" style="border-radius:2px"></div><span>2 · sharp</span></div>
    <div class="r"><div class="box" style="border-radius:4px"></div><span>4 · sm</span></div>
    <div class="r"><div class="box" style="border-radius:8px"></div><span>8 · md</span></div>
    <div class="r"><div class="box" style="border-radius:12px"></div><span>12 · lg</span></div>
    <div class="r"><div class="box" style="border-radius:16px"></div><span>16 · xl</span></div>
  </div>
</div>
</body></html>
