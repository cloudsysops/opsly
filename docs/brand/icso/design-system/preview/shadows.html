<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Opsly · Shadows & glows</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html,body{margin:0;background:#0A0A0A;color:#fff;font-family:var(--font-sans);}
  body{padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .card{height:110px;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;font-family:var(--font-mono);font-size:11px;color:#94A3B8;}
  .l{font-family:var(--font-mono);font-size:11px;color:#fff;text-transform:uppercase;letter-spacing:.14em;margin-bottom:4px;}
  .a{background:#101734;border:1px solid #223064;box-shadow:0 0 18px rgba(157,0,255,.18);}
  .b{background:#101734;border:1px solid transparent;background:linear-gradient(#101734,#101734) padding-box,linear-gradient(120deg,rgba(0,255,255,.7),rgba(255,0,255,.65),rgba(157,0,255,.7)) border-box;}
  .c{background:#111;border:1px solid #1E1E1E;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .d{background:#111;border:1px solid rgba(124,58,237,.6);box-shadow:0 0 40px rgba(139,92,246,.15);}
  .e{background:#101734;border:1px solid rgba(0,255,255,.45);box-shadow:0 0 0 1px rgba(0,255,255,.45),0 0 20px rgba(0,255,255,.2),0 0 40px rgba(157,0,255,.2);}
  .f{background:#111;border:1px dashed #1E1E1E;}
</style>
</head>
<body>
  <div class="card a"><span class="l">admin · card</span>shadow + magenta halo</div>
  <div class="card b"><span class="l">admin · holo-border</span>cyan→magenta→purple</div>
  <div class="card c"><span class="l">portal · elevated</span>shadow-lg/40 black</div>
  <div class="card d"><span class="l">web · highlighted</span>violet halo .15</div>
  <div class="card e"><span class="l">admin · neon-glow</span>cyan ring + purple bloom</div>
  <div class="card f"><span class="l">no shadow</span>border-only default</div>
</body></html>
