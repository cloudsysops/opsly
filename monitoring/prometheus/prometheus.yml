global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: hermes-monitor
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "rules/*.yml"

scrape_configs:
  # PostgreSQL (via postgres_exporter)
  - job_name: "postgresql"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis (via redis_exporter)
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Docker stats (via cadvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Node exporter (VPS host metrics)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
