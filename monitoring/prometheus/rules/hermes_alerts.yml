groups:
  - name: hermes_alerts
    interval: 30s
    rules:
      # Service health alerts
      - alert: ServiceDown
        expr: up{job=~"mcp-gateway|agent-manager|tenant-invitations|onboarding-agent|rendering-engine|mcp-rendering-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Service {{ $labels.job }} has been down for more than 2 minutes"

      # High error rate
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) 
           / sum(rate(http_requests_total[5m])) by (job)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in {{ $labels.job }}"
          description: "Error rate is above 5% for the last 5 minutes"

      # High latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected (p95 > 2s)"
          description: "{{ $labels.job }} is experiencing high latency"

      # Database connection pool exhausted
      - alert: DBConnectionPoolExhausted
        expr: pg_stat_activity_count >= 95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL connection pool nearly exhausted"
          description: "Current connections: {{ $value }}/100"

      # Redis memory usage high
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 80%"
          description: "Redis memory is {{ $value | humanizePercentage }} full"

      # Rendering queue backed up
      - alert: RenderingQueueBackup
        expr: hermes_rendering_queue_length > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rendering queue has {{ $value }} jobs pending"
          description: "Rendering engine may be overwhelmed"

      # Agent task failure rate
      - alert: HighAgentFailureRate
        expr: |
          (sum(rate(hermes_agent_tasks_failed_total[5m])) by (agent)
           / sum(rate(hermes_agent_tasks_total[5m])) by (agent)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent {{ $labels.agent }} has high failure rate"
          description: "Failure rate is {{ $value | humanizePercentage }}"

      # Tenant onboarding stuck
      - alert: OnboardingStuck
        expr: |
          (time() - hermes_tenant_onboarding_started_timestamp{status="in_progress"}) > 1800
        labels:
          severity: warning
        annotations:
          summary: "Tenant onboarding stuck for > 30 minutes"
          description: "Tenant {{ $labels.tenant }} is still onboarding"

      # Cost threshold exceeded
      - alert: CostThresholdExceeded
        expr: hermes_monthly_cost_usd > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Monthly cost exceeded $2,000"
          description: "Current monthly cost: ${{ $value }}"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space low on {{ $labels.device }}"
          description: "Only {{ $value | humanizePercentage }} space remaining"
